databases:
  - name: r2r2r-db
    databaseName: r2r2r
    user: r2r2r
    region: oregon

services:
  - type: web
    name: r2r2r-api
    runtime: node
    region: oregon
    rootDir: api
    buildCommand: npm install
    startCommand: node server.js
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: r2r2r-db
          property: connectionString
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false

  - type: web
    name: big-ten-sports
    runtime: node
    buildCommand: npm install && cd client && npm install && npm run build
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
    autoDeploy: true

staticSites:
  - name: r2r2r-companion
    buildCommand: bash build.sh
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: EXPO_PUBLIC_STRAVA_CLIENT_ID
        sync: false
      - key: EXPO_PUBLIC_STRAVA_CLIENT_SECRET
        sync: false
      - key: EXPO_PUBLIC_API_URL
        sync: false
